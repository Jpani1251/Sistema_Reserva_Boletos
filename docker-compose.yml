networks:
  app-network:
    driver: bridge

services:
  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3307
      - DB_USER=root
      - DB_PASS=root
      - BOLETA=2022630310
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  ms-lugares:
    build:
      context: ./ms-lugares
      dockerfile: Dockerfile
    container_name: ms-lugares
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3307
      - DB_USER=root
      - DB_PASS=root
      - BOLETA=2022630310
      - URL_USUARIOS=http://ms-usuarios:8081
    depends_on:
      - ms-usuarios
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  ms-compras:
    build:
      context: ./ms-compras
      dockerfile: Dockerfile
    container_name: ms-compras
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3307
      - DB_USER=root
      - DB_PASS=root
      - BOLETA=2022630310
      - URL_USUARIOS=http://ms-usuarios:8081
    depends_on:
      - ms-usuarios
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  ms-eventos:
    build:
      context: ./ms-eventos
      dockerfile: Dockerfile
    container_name: ms-eventos
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3307
      - DB_USER=root
      - DB_PASS=root
      - BOLETA=2022630310
      - URL_USUARIOS=http://ms-usuarios:8081
      - URL_LUGARES=http://ms-lugares:8082
      - URL_COMPRAS=http://ms-compras:8084
    depends_on:
      - ms-usuarios
      - ms-lugares
      - ms-compras
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-usuarios
      - ms-lugares
      - ms-eventos
      - ms-compras
    networks:
      - app-network
